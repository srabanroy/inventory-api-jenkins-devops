[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-api"
version = "1.1.1"
description = "A monitored inventory API used to demonstrate a seven-stage Jenkins pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask==3.1.3",
  "prometheus-client==0.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inventory_api = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["inventory_api"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.bandit]
exclude_dirs = ["tests"]
