services:
  inventory-api:
    image: ${IMAGE_REPOSITORY:-inventory-api}:${APP_VERSION:-1.0.0}
    environment:
      APP_ENV: production
      APP_VERSION: ${APP_VERSION:-1.1.0}
      DATABASE_PATH: /data/inventory.db
      INVENTORY_API_KEY: ${INVENTORY_API_KEY:?INVENTORY_API_KEY is required}
    ports:
      - "8082:8000"
    volumes:
      - production-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: always

volumes:
  production-data:
