services:
  inventory-api:
    image: ${IMAGE_REPOSITORY:-inventory-api}:${IMAGE_TAG:-local}
    environment:
      APP_ENV: staging
      APP_VERSION: ${IMAGE_TAG:-local}
      DATABASE_PATH: /data/inventory.db
      INVENTORY_API_KEY: ${INVENTORY_API_KEY:-staging-demonstration-key}
    ports:
      - "8081:8000"
    volumes:
      - staging-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  staging-data:
